name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-gitea-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium headless shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install --with-deps --only-shell --no-remove chromium

      - name: Run harness unit tests
        run: python -m pytest tests/unit -q

      - name: Run local Gitea API, browser, and persistence suite
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python scripts/run.py

      - name: Upload reports and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitea-quality-reports
          path: reports/runs/
          if-no-files-found: warn
          retention-days: 14
